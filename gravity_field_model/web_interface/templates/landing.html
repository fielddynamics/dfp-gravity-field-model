<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DFP: Gravity Field Model</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0a0f;
        }

        .landing-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .visual-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        #launch-canvas {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 200px;
            pointer-events: none;
            z-index: 100;
        }

        #launch-canvas.active {
            pointer-events: auto;
            cursor: pointer;
        }

        .launch-text {
            position: absolute;
            bottom: 85px;
            left: 50%;
            transform: translateX(-50%);
            color: #4488ff;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            pointer-events: none;
            z-index: 101;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .launch-text.hidden {
            opacity: 0;
        }
    </style>
</head>

<body>
    <div class="landing-container">
        <iframe id="visual-frame" class="visual-frame" src="/visual"
            allow="accelerometer; autoplay; encrypted-media; gyroscope"></iframe>

        <canvas id="launch-canvas"></canvas>
        <div id="launch-text" class="launch-text">Launch</div>
    </div>

    <script>
        // Hide the left panel and info panel in the iframe once loaded
        document.getElementById('visual-frame').addEventListener('load', function () {
            try {
                const iframeDoc = this.contentDocument || this.contentWindow.document;

                // Inject CSS to hide panels and toggle button
                const style = iframeDoc.createElement('style');
                style.textContent = `
                    #left-panel { display: none !important; }
                    #info-panel { display: none !important; }
                    #panel-toggle { display: none !important; }
                    
                    /* Make canvas take full width */
                    #canvas-container {
                        left: 0 !important;
                        width: 100% !important;
                    }
                `;
                iframeDoc.head.appendChild(style);

            } catch (e) {
                console.log('Could not inject styles into iframe:', e);
            }
        });

        // Three.js Launch Button
        (function () {
            const canvas = document.getElementById('launch-canvas');
            const launchText = document.getElementById('launch-text');

            // Scene setup
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(50, window.innerWidth / 200, 0.1, 1000);
            camera.position.z = 5;

            const renderer = new THREE.WebGLRenderer({
                canvas: canvas,
                alpha: true,
                antialias: true
            });
            renderer.setSize(window.innerWidth, 200);
            renderer.setPixelRatio(window.devicePixelRatio);

            // Create torus (ring) button
            const torusGeometry = new THREE.TorusGeometry(0.6, 0.08, 16, 100);
            const torusMaterial = new THREE.MeshBasicMaterial({
                color: 0x4488ff,
                transparent: true,
                opacity: 0.9
            });
            const torus = new THREE.Mesh(torusGeometry, torusMaterial);
            torus.position.y = -0.3;
            scene.add(torus);

            // Inner glow sphere
            const glowGeometry = new THREE.SphereGeometry(0.4, 32, 32);
            const glowMaterial = new THREE.MeshBasicMaterial({
                color: 0x4488ff,
                transparent: true,
                opacity: 0.15
            });
            const glow = new THREE.Mesh(glowGeometry, glowMaterial);
            glow.position.y = -0.3;
            scene.add(glow);

            // Center dot
            const dotGeometry = new THREE.SphereGeometry(0.08, 16, 16);
            const dotMaterial = new THREE.MeshBasicMaterial({
                color: 0x4488ff,
                transparent: true,
                opacity: 0.8
            });
            const dot = new THREE.Mesh(dotGeometry, dotMaterial);
            dot.position.y = -0.3;
            scene.add(dot);

            // Animation state
            let isAnimating = false;
            let isHovering = false;
            let animationProgress = 0;
            const startY = -0.3;
            const targetY = 8;  // Fly upward into the visualization

            // Raycaster for click detection
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();

            // Enable pointer events
            canvas.classList.add('active');

            // Click handler
            canvas.addEventListener('click', (event) => {
                if (isAnimating) return;

                const rect = canvas.getBoundingClientRect();
                mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects([torus, glow, dot]);

                if (intersects.length > 0) {
                    startLaunchAnimation();
                }
            });

            // Hover detection
            canvas.addEventListener('mousemove', (event) => {
                if (isAnimating) return;

                const rect = canvas.getBoundingClientRect();
                mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects([torus, glow, dot]);

                isHovering = intersects.length > 0;
                canvas.style.cursor = isHovering ? 'pointer' : 'default';
            });

            function startLaunchAnimation() {
                isAnimating = true;
                animationProgress = 0;
                launchText.classList.add('hidden');
                canvas.classList.remove('active');
            }

            // Animation loop
            function animate() {
                requestAnimationFrame(animate);

                // Gentle rotation
                torus.rotation.z += 0.01;

                // Hover pulse effect
                if (!isAnimating) {
                    const pulse = Math.sin(Date.now() * 0.003) * 0.1 + 1;
                    const hoverScale = isHovering ? 1.15 : 1;
                    torus.scale.setScalar(pulse * hoverScale);
                    glow.scale.setScalar(pulse * hoverScale);
                    dot.scale.setScalar(pulse * hoverScale);

                    // Hover glow
                    glowMaterial.opacity = isHovering ? 0.3 : 0.15;
                }

                // Launch animation
                if (isAnimating) {
                    animationProgress += 0.02;

                    // Ease out cubic
                    const eased = 1 - Math.pow(1 - Math.min(animationProgress, 1), 3);

                    // Move upward
                    const y = startY + (targetY - startY) * eased;
                    torus.position.y = y;
                    glow.position.y = y;
                    dot.position.y = y;

                    // Scale down as it flies away
                    const scale = Math.max(0, 1 - eased * 0.8);
                    torus.scale.setScalar(scale);
                    glow.scale.setScalar(scale);
                    dot.scale.setScalar(scale);

                    // Fade out
                    torusMaterial.opacity = Math.max(0, 0.9 - eased);
                    glowMaterial.opacity = Math.max(0, 0.3 - eased * 0.3);
                    dotMaterial.opacity = Math.max(0, 0.8 - eased);

                    // Spin faster as it flies
                    torus.rotation.z += 0.05 * (1 + eased * 3);

                    // Launch app when animation completes
                    if (animationProgress >= 1.2) {
                        window.location.href = '/app';
                    }
                }

                renderer.render(scene, camera);
            }

            animate();

            // Handle resize
            window.addEventListener('resize', () => {
                renderer.setSize(window.innerWidth, 200);
            });
        })();
    </script>
</body>

</html>
